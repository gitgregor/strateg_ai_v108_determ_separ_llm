[project]
name = "strateg-ai-advisor-backend"
version = "1.0.8"
description = "Complete modular backend for AI Investment Advisor supporting Spot & Futures across Crypto and Equities with strict deterministic/probabilistic isolation."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "pandas-ta-classic==0.9.0",
    "numba>=0.60.0",
    "smartmoneyconcepts>=0.0.26",
    "transformers>=4.46.0",
    "torch>=2.5.0",
    "yfinance>=0.2.48",
    "httpx>=0.27.2",
    "langgraph>=0.2.45",
    "langchain-core>=0.3.15",
    "vibe-trading-ai[smc]>=0.1.7",
    "vectorbt>=0.26.2",
    "nautilus_trader>=1.200.0",
    "ccxt>=4.4.25",
    "ib_async>=1.0.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[tool.uv]
python-preference = "managed"
default-groups = ["dev"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
